<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InkWave Admin — The Harbour</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#040b14;
      color:#cce8f0;
      font-family:'DM Sans', sans-serif;
      padding:20px;
    }

    header {
      display:flex;
      justify-content:space-between;
      padding:20px;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .logo {
      font-family:'Cormorant Garamond';
      font-size:1.5rem;
      color:#a8d8e8;
    }

    .badge {
      font-size:0.7rem;
      color:#1a8fa8;
    }

    .container {
      max-width:1000px;
      margin:30px auto;
    }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th, td {
      padding:12px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      font-size:0.85rem;
      text-align:left;
    }

    th {
      color:#1a8fa8;
      text-transform:uppercase;
      font-size:0.7rem;
    }

    .btn {
      background:none;
      border:1px solid #e88080;
      color:#e88080;
      padding:5px 10px;
      cursor:pointer;
      border-radius:6px;
    }

    .btn:hover {
      background:#e8808020;
    }

    .empty {
      text-align:center;
      padding:40px;
      opacity:0.5;
    }
  </style>
</head>

<body>

<header>
  <div class="logo"><span style="color:#1a8fa8">Ink</span>Wave Admin</div>
  <div class="badge">Firebase Dashboard</div>
</header>

<div class="container">

  <h2>Bookings</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Instagram</th>
        <th>Story</th>
        <th>Genre</th>
        <th>Scene</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="bookingsBody"></tbody>
  </table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEai-dN4SQ4vP23EC-06Djr9V2FgP29ek",
  authDomain: "inkwave-site-15870.firebaseapp.com",
  projectId: "inkwave-site-15870",
  storageBucket: "inkwave-site-15870.firebasestorage.app",
  messagingSenderId: "774996313737",
  appId: "1:774996313737:web:b9b6b9399c9649a7252858"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DELETE
window.deleteBooking = async function(id) {
  await deleteDoc(doc(db, "bookings", id));
};

// READ LIVE DATA
const q = query(collection(db, "bookings"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
  const tbody = document.getElementById("bookingsBody");
  let rows = "";

  if (snapshot.empty) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">No bookings yet</td></tr>`;
    return;
  }

  snapshot.forEach((docSnap) => {
    const d = docSnap.data();

    rows += `
      <tr>
        <td>${d.name || "—"}</td>
        <td>${d.insta || "—"}</td>
        <td>${d.story || "—"}</td>
        <td>${d.genre || "—"}</td>
        <td>${d.scene || "—"}</td>
        <td>
          <button class="btn" onclick="deleteBooking('${docSnap.id}')">
            Remove
          </button>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = rows;
});
</script>

</body>
</html>
